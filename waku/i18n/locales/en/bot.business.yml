    errors:
      review_first: Enter the required details and review the request before saving.
      owner_only: Only the Business account owner can use this menu in a private chat with the bot.
      no_connection: No Business connection recorded. Connect the bot, send a message in a managed chat, then reopen
        /business.
      connection_disabled: The Business connection is disabled or revoked.
      management_disabled: Enable Management and Save, then reopen the menu.
      missing_right: Telegram has not granted this right. Update the connected bot's rights in your account settings.
      save_first: Save settings first, then reopen the menu to perform an operation.
      invalid_input: Invalid format or Telegram limit exceeded.
      need_media: Send a suitable photo or video following the instructions.
      media_limit: Invalid file or too large (photos up to 10 MB, other files 50 MB).
      unobserved_chat: This bot has not received messages from this chat. Use Conversations and check the Telegram
        access scope.
      unobserved_message: Message ID not found in this observed chat, or already deleted.
      not_bot_message: This operation applies only to messages sent by this bot.
      reply_window: No incoming message in the last 24 hours. Telegram does not allow sending or editing here.
      expired: Menu or input expired. Reopen /business.
      api_rejected: Telegram rejected the operation. Check rights, IDs, formats and account limits before creating
        another request.
      uncertain: Result could not be confirmed. Check Telegram before creating another request to avoid duplication.
      cancel_unavailable: This reminder was processed or is being sent and cannot be cancelled.
    help:
      send_message: Send chat ID on the first line, followed by message text. Find IDs in Conversations.
      send_media: 'Send a file. Caption: chat ID on the first line, then text (up to 1024 characters).'
      edit_message: 'Send three parts on separate lines: chat ID, bot message ID, new text.'
      mark_read: 'Send two lines: chat ID, incoming message ID to mark as read.'
      delete_sent: Send chat ID on the first line; bot message IDs below, separated by spaces or commas (up to 100).
      delete_all: Send chat ID on the first line; message IDs below, separated by spaces or commas (up to 100).
      set_name: Send first name, then optional last name on a second line. Use - to clear last name.
      set_username: Send the new username, or - to remove it.
      set_bio: Send the new bio (up to 140 characters), or - to clear it.
      set_photo: Send a photo for the Business account avatar.
      convert_gift: Send an owned gift ID from View Gifts. It will be converted to Stars.
      upgrade_gift: 'Send two lines: owned gift ID; Stars you agree to pay. 0 = prepaid upgrade only, no automatic
        Stars payment.'
      transfer_gift: 'Send three lines: owned gift ID; recipient ID; Stars you agree to pay. 0 = free transfer only.
        Recipient must have an active chat in the last 24 hours.'
      transfer_stars: Send Stars amount (1–10000) to move from the Business account to the bot's balance.
      post_story: Send a story photo (1080×1920) or portrait video (720×1280, up to 60 seconds), with optional caption.
        Visible for 24 hours.
      edit_story: 'Send new story photo/video. Caption: story ID on the first line, then new caption. Only bot-posted
        stories can be edited.'
      delete_story: Send a story ID to delete. Only bot-posted stories can be deleted.
