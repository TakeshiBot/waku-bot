    verify:
      wrong_prefix: |
        Trả lời sai rồi
      challenge_math_easy: |-
        Xác minh: {a} + {b} = ?
        Số lần còn lại: {attempts}/{max}
      challenge_math_hard: |-
        Hãy trả lời:
        {question}
        Số lần còn lại: {attempts}/{max}
      challenge_emoji: |-
        Nhấn vào biểu tượng này: {emoji}
        Số lần còn lại: {attempts}/{max}
      challenge_sticker: Trả lời tin nhắn này bằng một nhãn dán bất kỳ để hoàn tất xác minh.
      challenge_qa: |-
        Trả lời câu hỏi:
        {question}
        Số lần còn lại: {attempts}/{max}
        (nhấn nút bên dưới để chọn đáp án)
      challenge_qa_multi: |-
        Chọn tất cả đáp án đúng:
        {question}
        Số lần còn lại: {attempts}/{max}
        (có thể chọn nhiều đáp án, rồi nhấn xác nhận)
      wrong_alert: Trả lời sai rồi, còn {attempts}/{max} lần thử.
      success: '{user} đã xác minh thành công, chào mừng bạn!'
      failed_prefix: '{user} không vượt qua xác minh'
      timeout_prefix: '{user} hết thời gian xác minh'
      action_kick: ', đã bị xóa khỏi nhóm'
      action_ban: ', đã bị cấm'
      action_unrestrict: ', đã được cho phép tham gia'
      timeout_hint: Hãy hoàn tất xác minh trong {timeout} giây.
      admin_banned: '{user} đã bị quản trị viên cấm.'
      test_not_enabled: Nhóm này chưa bật xác minh thành viên mới.
      test_user_not_found: Không tìm thấy người dùng.
      test_verify_failed: 'Không khởi động được xác minh: không thể hạn chế thành viên này.'
      expired: Phiên xác minh này đã hết hiệu lực.
      math_hard:
        calculus:
          derivative: Cho $f(x) = {a}x^{n}$, tính $f'({x})$.
          integral: $\int_0^1 {coef}x^{n}\,dx$
          limit: $\lim_{{x\to 0}}\frac{{\sin({k}x)}}{{x}}$
        linear_algebra:
          invertible_criterion:
            question: Cho A là ma trận thực {n}×{n}. Điều kiện tương đương với "A khả nghịch" là
            answers:
            - det(A) ≠ 0
            - Tồn tại ma trận vuông B sao cho AB = BA = I
            - Các vectơ cột của A độc lập tuyến tính
            - 0 không phải giá trị riêng của A
            wrong:
            - det(A) = 0
            - Mọi phần tử của A đều khác 0
            - A là ma trận đối xứng
            - Hạng của A bằng 1
          rank_nullity: Cho A là ma trận {n}×{n}, rank(A) = {rank}. Tính dim null(A).
          det_scale: Cho A là ma trận {n}×{n}. Tính $\det({c}A)$.
          diagonalizable:
            question: Cho A là ma trận {n}×{n}. A chéo hóa được khi và chỉ khi
            answers:
            - A có n vectơ riêng độc lập tuyến tính
            - Bội hình học của mỗi giá trị riêng bằng bội đại số của nó
            wrong:
            - A có n giá trị riêng kể cả bội số
            - A khả nghịch
            - rank(A) = n
            - Đa thức đặc trưng của A không có nghiệm bội
          trace_eigen:
            question: Vết tr(A) của ma trận vuông A bằng
            answers:
            - Tổng các giá trị riêng
            - Tổng các phần tử trên đường chéo chính
            wrong:
            - Tích các giá trị riêng
            - Tổng tất cả phần tử
            - Định thức
            - Hiệu các giá trị riêng
          symmetric_eigen:
          - question: Mọi giá trị riêng của ma trận thực đối xứng A đều là
            answer: Số thực
            wrong:
            - Số thuần ảo
            - Số không âm
            - Các số khác nhau
          - question: Ma trận thực đối xứng A có thể chéo hóa trực giao, tức tồn tại ma trận trực giao
              Q sao cho $Q^T A Q$ là
            answer: Ma trận đường chéo
            wrong:
            - Ma trận tam giác
            - Ma trận đơn vị
            - Ma trận không
          transpose_inverse:
          - question: Cho A khả nghịch. $(A^T)^{-1}$ bằng
            answer: (A⁻¹)ᵀ
            wrong:
            - A⁻¹
            - Aᵀ
            - A
          - question: Cho A và B khả nghịch. $(AB)^{-1}$ bằng
            answer: B⁻¹A⁻¹
            wrong:
            - A⁻¹B⁻¹
            - A⁻¹
            - AB
          null_space_domain:
          - question: Không gian nghiệm của ma trận thực A kích thước m×n là không gian con của
            answer: Rⁿ
            wrong:
            - Rᵐ
            - R
            - Không thuộc không gian nào
          - question: Không gian cột của ma trận thực A kích thước m×n là không gian con của
            answer: Rᵐ
            wrong:
            - Rⁿ
            - R
            - Không thuộc không gian nào
          positive_definite:
          - question: Ma trận thực đối xứng A xác định dương khi và chỉ khi các giá trị riêng của nó
            answer: Đều lớn hơn 0
            wrong:
            - Đều không âm
            - Đều nhỏ hơn 0
            - Đôi một khác nhau
          - question: Ma trận thực đối xứng A nửa xác định dương khi và chỉ khi các giá trị riêng của
              nó
            answer: Đều không âm
            wrong:
            - Đều lớn hơn 0
            - Đều nhỏ hơn 0
            - Đôi một khác nhau
          - question: Ma trận thực đối xứng A xác định âm khi và chỉ khi các giá trị riêng của nó
            answer: Đều nhỏ hơn 0
            wrong:
            - Đều không âm
            - Đều lớn hơn 0
            - Đôi một khác nhau
        probability:
          uniform_e: Cho $X \sim U({a}, {b})$. Tính $E[X]$.
          uniform_var: Cho $X \sim U(0, {b})$. Tính $Var(X)$.
          exp_e: Cho $X \sim Exp({lam})$. Tính $E[X]$.
          normal_prob: Cho $X \sim N({mu}, {sigma2})$. Tính $P(X \le {mu})$.
          binomial_e: Cho $X \sim B({n}, {p})$. Tính $E[X]$.
          poisson_var: Cho $X \sim Poisson({lam})$. Tính $Var(X)$.
          var_scale: Cho $X \sim U(0, 6)$. Tính $Var({c}X)$.
          monty_hall: 'Bài toán Monty Hall: có {n} cánh cửa. Sau khi người dẫn chương trình mở một cửa
            không có phần thưởng, xác suất trúng thưởng khi đổi cửa là'
          max_two_uniform: Cho $X_1, \ldots, X_{k} \sim U(0,1)$ độc lập. Tính $E[\max(X_1, \ldots, X_{k})]$.
          chebyshev: Cho $E[X]={mu}$, $Var(X)={var}$. Dùng bất đẳng thức Chebyshev để tìm cận trên của
            $P(|X-{mu}| \ge {bound})$.
          sum_expectation: Cho $X \sim U({a},{b})$, $Y \sim Exp({lam})$ độc lập. Tính $E[X+Y]$.
          second_moment: Cho $X \sim U(0, {b})$. Tính $E[X^2]$.
      default_questions:
      - question: Tóc của Hatsune Miku có màu gì?
        options:
        - Xanh lá
        - Xanh dương
        - Hồng
        - Màu hành lá
        answers:
        - Xanh lá
        - Màu hành lá
        select: any
      - question: Ai là bạn đồng hành của Nhà Lữ Hành trong Genshin Impact?
        options:
        - Paimon
        - Dodoco
        - Nahida
        - Ronova
        answers:
        - Paimon
      - question: Tháng nào là bất tận?
        options:
        - Tháng Tám
        - Tháng Tư
        - Tháng Băng
        - Tháng Sương
        answers:
        - Tháng Tám
