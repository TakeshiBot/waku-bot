bot:
  restart:
    denied: Bạn không có quyền khởi động lại bot.
    invalid_config: Cấu hình hiện tại không hợp lệ. Hãy kiểm tra settings.toml trước khi khởi động lại bot.
    restarting: '⌬ <b>Waku đang khởi động lại…</b>'
    menu: "<b>🔄 Khởi động lại Waku</b>\n\nChọn khởi động lại bot, hoặc cập nhật source từ Git rồi build và triển khai cả bot cùng Mini App."
    restart_button: '1. Khởi động lại'
    update_button: '2. Cập nhật'
    confirm_restart: "<b>Khởi động lại bot?</b>\nChọn Yes để thực hiện, No để quay lại."
    confirm_update: "<b>Cập nhật bot và Mini App?</b>\nSource mới sẽ được pull, build và triển khai. Chọn Yes để thực hiện, No để quay lại."
    update_available: "⚠️ Có {count} commit mới.\nĐang chạy: <code>{current}</code>\nMới nhất: <code>{latest}</code>"
    up_to_date: '✅ Bot đang chạy commit mới nhất: <code>{current}</code>.'
    local_ahead: 'Commit đang chạy <code>{current}</code> mới hơn trên repo; chưa có bản cập nhật.'
    diverged: '⚠️ Commit đang chạy và repo đã phân nhánh khác nhau. Cần kiểm tra Git trước khi cập nhật.'
    check_unavailable: 'Không kiểm tra được commit mới trên repo. Bạn vẫn có thể chọn khởi động lại hoặc cập nhật.'
    close: Đóng
    expired: Menu đã hết hạn hoặc không thuộc về bạn. Mở lại /restart.
    worker_unavailable: 'Cầu nối cập nhật trên VPS chưa chạy. Chạy bash run.sh restart trên VPS để bật lại; VPS cần Python 3.'
    updating: '⌬ <b>Waku đang cập nhật…</b>'
    busy: Đang có một yêu cầu khởi động lại hoặc cập nhật được xử lý. Vui lòng chờ kết quả ở tin nhắn trước.
    storage_error: Không lưu được thông tin khởi động lại. Bot vẫn tiếp tục chạy; kiểm tra quyền ghi thư mục data/maintenance.
    restart_success: '⌬ <b>Waku đã khởi động lại!</b>'
    update_success: '⌬ <b>Waku đã cập nhật và triển khai thành công!</b>'
    update_failed: '⌬ <b>Cập nhật chưa thành công</b>'
    status_details: |-
      │
      ┟ <b>Ngày</b>: {date}
      ┠ <b>Giờ</b>: {time}
      ┠ <b>Múi giờ</b>: <code>{timezone}</code>
      ┠ <b>Phiên bản</b>: <code>{version}</code>
      ┖ <b>Commit</b>: <code>{commit}</code>
    request_pending: |-
      ⌬ <b>Yêu cầu</b>
      │
      ┖ <b>Người dùng</b>: <a href="tg://user?id={user_id}">{user}</a>
    request_completed: |-
      ⌬ <b>Yêu cầu</b>
      │
      ┟ <b>Người dùng</b>: <a href="tg://user?id={user_id}">{user}</a>
      ┖ <b>Thời gian xử lý</b>: {seconds} giây
    result_details: "⌬ <b>Thông tin cập nhật</b>\n│\n┟ <b>Commit trước</b>: <code>{before}</code>\n┠ <b>Commit đang chạy</b>: <code>{commit}</code>\n┠ <b>Nội dung</b>: {subject}\n┖ <b>Ngày commit</b>: {date}"
    update_log: 'Chi tiết trên VPS: logs/maintenance-update.log'
