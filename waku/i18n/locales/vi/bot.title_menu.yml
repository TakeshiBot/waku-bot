title_menu:
  preset: "Cấp Quyền\nBot cấp admin theo đúng các quyền bật bên dưới. Bấm Lưu để áp dụng. Quyền Quản Lý Nhóm luôn có khi là admin."
  settings: "Cài Đặt Nhóm\nThay đổi chỉ áp dụng khi bấm Lưu. Đóng để bỏ thay đổi."
  language: "Ngôn Ngữ"
  grant: "Cấp Quyền"
  choose_language: "Ngôn Ngữ Nhóm\nChọn ngôn ngữ rồi bấm Lưu để áp dụng."
  back: "Quay Lại"
  denied: "Không xác minh được quyền Telegram của bạn và bot để sửa mục này. Quản trị ẩn danh cần dùng tài khoản cá nhân."
  bot_tags: "Bot cần là admin nhóm và có quyền Quản lý nhãn (Manage Tags) để sửa nhãn thành viên. Admin bot không thay thế được quyền Telegram của bot."
  bot_promote: "Để sửa chức danh admin, bot cần quyền Thêm quản trị viên (Add Administrators)."
  actor_tags: "Bạn cần quyền Quản lý nhãn của nhóm hoặc là admin bot để sửa nhãn người khác. Thành viên thường chỉ được tự sửa nhãn khi nhóm cho phép."
  actor_promote: "Bạn cần quyền Thêm quản trị viên của nhóm hoặc là admin bot để sửa chức danh admin khác."
  self_tag_disabled: "Nhóm đang không cho bạn tự sửa nhãn. Nhờ admin có quyền Quản lý nhãn hoặc admin bot đặt giúp."
  target_owner: "Bot không thể sửa chức danh của chủ nhóm."
  target_uneditable: "Telegram không cho bot sửa admin này. Cần admin do bot có quyền quản lý; cấp thêm quyền cho bot không tự làm admin khác trở nên sửa được."
  target_hierarchy: "Bạn không có quyền quản lý admin này trong chuỗi bổ nhiệm. Nhờ chủ nhóm hoặc admin bot xử lý; bot vẫn phải có quyền sửa đối tượng."
  target_not_member: "Đối tượng không còn là thành viên trong nhóm này."
  telegram_rejected: "Telegram từ chối cập nhật nhãn ({reason}). Chưa xác nhận thành công; kiểm tra quyền bot và khả năng sửa đối tượng."
  invalid: "Nhãn phải tối đa 16 ký tự, không chứa emoji hoặc ký tự điều khiển."
  changed: "Quyền đã thay đổi; hãy tải lại và kiểm tra trước khi sửa."
  expired: "Menu đã hết hạn hoặc không thuộc về bạn. Mở lại /sett."
  error: "Thao tác chưa xác minh được kết quả; hãy kiểm tra Telegram trước khi thử lại."
  done: "Đã cập nhật nhãn; quyền quản trị không thay đổi."
  saved: 'Đã lưu cài đặt. Menu tự xóa sau 5 giây.'
  conflict: 'Cài đặt đã thay đổi ở menu khác. Mở lại /sett để lấy cấu hình mới.'
  unsupported: "Quyền này không khả dụng cho nhóm hoặc SDK hiện tại."
