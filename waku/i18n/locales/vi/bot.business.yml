    errors:
      review_first: Nhập đủ nội dung và xem lại yêu cầu trước khi Lưu.
      owner_only: Chỉ chủ tài khoản Business được dùng menu này trong DM với bot.
      no_connection: Chưa ghi nhận kết nối Business. Kết nối bot, gửi một tin trong chat được quản lý, rồi mở lại
        /business.
      connection_disabled: Kết nối Business đã bị tắt hoặc thu hồi.
      management_disabled: Bật Quản Lý rồi bấm Lưu, sau đó mở lại menu.
      missing_right: Telegram chưa cấp quyền này. Đổi quyền trong cài đặt bot Business của tài khoản.
      save_first: Bấm Lưu cài đặt trước, rồi mở lại menu để thực hiện thao tác.
      invalid_input: Nội dung chưa đúng định dạng hoặc vượt giới hạn Telegram.
      need_media: Gửi ảnh hoặc video phù hợp theo hướng dẫn.
      media_limit: File không hợp lệ hoặc quá lớn (ảnh tối đa 10 MB, file khác 50 MB).
      unobserved_chat: Bot chưa nhận tin từ chat này. Chọn ID trong Cuộc Chat và kiểm tra phạm vi truy cập ở Telegram.
      unobserved_message: ID tin không có trong chat bot đã quan sát hoặc tin đã bị xóa.
      not_bot_message: Thao tác này chỉ áp dụng với tin do chính bot gửi.
      reply_window: Chat chưa có tin đến trong 24 giờ gần nhất; Telegram chưa cho gửi hoặc sửa tin.
      expired: Menu hoặc lượt nhập đã hết hạn. Mở lại /business.
      api_rejected: Telegram từ chối thao tác. Kiểm tra quyền, ID, định dạng và giới hạn tài khoản trước khi tạo
        yêu cầu mới.
      uncertain: Chưa xác nhận được kết quả. Kiểm tra Telegram trước khi tạo yêu cầu mới để tránh thực hiện trùng.
      cancel_unavailable: Lịch hẹn đã được xử lý hoặc đang gửi; không thể hủy.
    help:
      send_message: Gửi ID chat ở dòng đầu, nội dung từ dòng thứ hai. Chọn ID trong Cuộc Chat.
      send_media: 'Gửi file. Chú thích: dòng đầu là ID chat, các dòng sau là nội dung (tối đa 1024 ký tự).'
      edit_message: 'Gửi 3 phần theo dòng: ID chat, ID tin do bot gửi, nội dung mới.'
      mark_read: 'Gửi 2 dòng: ID chat, ID tin đến cần đánh dấu đã đọc.'
      delete_sent: Gửi ID chat ở dòng đầu; dòng sau là ID tin do bot gửi, cách nhau bằng dấu cách hoặc dấu phẩy
        (tối đa 100).
      delete_all: Gửi ID chat ở dòng đầu; dòng sau là ID tin cần xóa, cách nhau bằng dấu cách hoặc dấu phẩy (tối
        đa 100).
      set_name: Gửi tên ở dòng đầu; họ ở dòng thứ hai (không bắt buộc). Dấu - để bỏ họ.
      set_username: Gửi username mới, hoặc - để xóa username.
      set_bio: Gửi giới thiệu mới (tối đa 140 ký tự), hoặc - để xóa.
      set_photo: Gửi ảnh mới làm avatar của tài khoản Business.
      convert_gift: Gửi ID quà sở hữu từ Xem Quà. Quà sẽ được đổi thành Sao.
      upgrade_gift: 'Gửi 2 dòng: ID quà sở hữu; số Sao đồng ý trả. 0 = chỉ nâng cấp đã trả trước, không tự chi Sao.'
      transfer_gift: 'Gửi 3 dòng: ID quà sở hữu; ID người nhận; số Sao đồng ý trả. 0 = chỉ chuyển miễn phí. Người
        nhận phải có chat hoạt động trong 24 giờ.'
      transfer_stars: Gửi số Sao (1–10000) để chuyển từ tài khoản Business về số dư bot.
      post_story: Gửi ảnh story 1080×1920 hoặc video dọc 720×1280, tối đa 60 giây; chú thích nếu có. Story hiển
        thị 24 giờ.
      edit_story: 'Gửi ảnh/video story mới. Chú thích: dòng đầu là ID story, các dòng sau là chú thích mới. Chỉ
        sửa story do bot đăng.'
      delete_story: Gửi ID story cần xóa. Chỉ xóa story do bot đăng.
