bot:
  prompts:
    agent_compaction_summary_instruction: '将上面的对话总结为一份结构化交接摘要，以便稍后继续对话。

      重要：如果对话以尚未回答的问题或等待用户回复的请求结束，必须原样保留该问题或请求。

      使用以下结构（省略不适用的部分）：

      ## 目标

      [用户想要什么；如果对话涉及多个主题，分别列出]

      ## 约束与偏好

      - [用户说明的约束或偏好]

      ## 进度

      ### 已完成

      - [x] [已完成的事项]

      ### 进行中

      - [ ] [当前工作]

      ### 受阻

      - [阻碍进度的问题]

      ## 关键决策

      - **[决策]**：[简要理由]

      ## 下一步

      1. [按顺序列出的下一步行动]

      ## 关键上下文

      - [重要数据、待回答问题、参考资料；保留谁说了什么，发送者姓名和 ID 必须与标签完全一致，不得合并两位发言者的内容]

      ## 补充说明

      [其他重要信息，包括用户如何称呼你]

      仅输出结构化摘要；不得继续对话，不得回答其中的问题。各部分保持简洁。准确保留姓名、ID、日期、链接、偏好和独特措辞。使用与对话相同的语言。'
    agent_multimodal_transcribe_prompt: 用户发送了多媒体内容(图片/音频/视频/文档)。请仔细查看并转述其中包含的所有关键信息, 供另一个无法查看媒体的模型理解。只输出转述内容本身,
      不要额外寒暄或解释。
    agent_sticker_description_prompt: 用 1–2 句话描述这张贴纸传达的情绪、心情或含义。重点说明它在对话中的典型用法，例如表达快乐、讽刺、赞同、沮丧或喜爱。请简洁、具体。
    agent_channel_comment_prompt: 评论这条频道的帖子
  config:
    reload_restart: 无法重载：{field} 已更改（需要重启）
    reload_empty_memory: 加载的 powermem_config 为空
    reload_success: 配置重载成功
    reload_failed: 重载失败：{error}
